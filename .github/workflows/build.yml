name: Build highlight-reflow

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
    branches: ['**']

env:
  XOVI_TAG: v0.3.3

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: aarch64
            image: eeems/remarkable-toolchain:5.8.203-aarch64
            sdk: ferrari
          - arch: armv7
            image: eeems/remarkable-toolchain:latest-rm1
            sdk: rm1
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download xovi source
        run: |
          curl -L -o xovi.tar.gz \
            "https://github.com/asivery/xovi/archive/refs/tags/$XOVI_TAG.tar.gz"
          tar -xzf xovi.tar.gz
          mv xovi-* xovi-repo
          rm xovi.tar.gz

      - name: Build ${{ matrix.arch }}
        shell: bash
        env:
          LC_ALL: C.UTF-8
        run: |
          . "$(find /opt/codex/${{ matrix.sdk }} -name 'environment-setup-*' -type f | head -n1)"
          export XOVI_REPO="$GITHUB_WORKSPACE/xovi-repo"
          qmake6
          make
          mv highlight-reflow.so highlight-reflow-${{ matrix.arch }}.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: highlight-reflow-${{ matrix.arch }}
          path: highlight-reflow-${{ matrix.arch }}.so
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate changelog
        run: |
          git cliff --config-url https://gist.githubusercontent.com/rmitchellscott/823c46de7a1c3e6d57e9de90ee00d84a/raw/cliff.toml \
            --latest --strip header | tail -n +2 > RELEASE_NOTES.md
          git cliff --config-url https://gist.githubusercontent.com/rmitchellscott/823c46de7a1c3e6d57e9de90ee00d84a/raw/cliff.toml > CHANGELOG.md

      - name: Add device compatibility info
        run: |
          cat >> RELEASE_NOTES.md << 'EOF'

          ## Device Compatibility

          - **reMarkable 1 & 2**: `highlight-reflow-armv7.so`
          - **reMarkable Paper Pro, Paper Pro Move and Paper Pure**: `highlight-reflow-aarch64.so`
          EOF

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No changelog changes to commit"
          else
            git commit -m "chore(release): update changelog for ${{ github.ref_name }} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: highlight-reflow-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: highlight-reflow-*.so
          body_path: RELEASE_NOTES.md
